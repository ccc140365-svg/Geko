<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Gecko Everyday</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Giao diện câu hỏi */
        #main-card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(46, 213, 115, 0.2);
            border: 2px solid #2ed573;
            max-width: 90%;
            width: 420px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #2ed573;
        }

        .btn-group {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes {
            background-color: #2ed573;
            color: white;
        }

        .btn-no {
            background-color: #ff4757;
            color: white;
        }

        .btn:hover {
            transform: scale(1.08);
        }

        /* Màn hình hù (Jumpscare) */
        #scare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
        }

        #scare-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Hiệu ứng rung lắc & chớp nháy viền */
        .shake-effect {
            animation: shake 0.08s infinite, flash 0.15s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) scale(1.1); }
            20% { transform: translate(-20px, 20px) scale(1.2); }
            40% { transform: translate(-20px, -20px) scale(1.1); }
            60% { transform: translate(20px, 20px) scale(1.2); }
            80% { transform: translate(20px, -20px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1.1); }
        }

        @keyframes flash {
            0% { border: 12px solid #ff0000; }
            50% { border: 12px solid #000000; }
            100% { border: 12px solid #ff0000; }
        }
    </style>
</head>
<body>

    <!-- Màn hình câu hỏi -->
    <div id="main-card">
        <h1>🦎 Do you want to celebrate House Gecko Everyday with me? 🦎</h1>
        <div class="btn-group">
            <button class="btn btn-yes" onclick="triggerScare()">Yes</button>
            <button class="btn btn-no" onclick="triggerScare()">No</button>
        </div>
    </div>

    <!-- Màn hình hù -->
    <div id="scare-screen">
        <img id="scare-img" src="1000134164.png" alt="House Gecko">
    </div>

    <!-- Âm thanh tiếng hét kinh dị -->
    <audio id="scare-sound" src="https://assets.mixkit.co/active_storage/sfx/2162/2162-preview.mp3" preload="auto"></audio>

    <script>
        function triggerScare() {
            // Phóng to toàn màn hình
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            // Hiện màn hình hù + hiệu ứng rung lắc
            let scareScreen = document.getElementById('scare-screen');
            scareScreen.style.display = 'block';
            scareScreen.classList.add('shake-effect');

            // Phát âm thanh tiếng hét
            let sound = document.getElementById('scare-sound');
            sound.volume = 1.0;
            sound.play().catch(e => console.log("Lỗi phát âm thanh:", e));
        }
    </script>
</body>
</html>
